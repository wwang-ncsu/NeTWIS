<!DOCTYPE html>
<html lang="en">
<head>
<!-- 2026-09-29 21:40:18 -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
    }

    iframe {
      border: 0;
      width: 100%;
      height: 100%;
    }

    .message {
      color: #fff;
      font: 16px/1.5 Arial, sans-serif;
      max-width: 720px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .message a {
      color: #9fd3ff;
    }
  </style>
</head>
<body>
  <div id="message" class="message" hidden></div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const message = document.getElementById("message");

      if (!file) {
        message.hidden = false;
        message.textContent = "No PDF file was provided.";
        return;
      }

      let fileUrl;
      try {
        fileUrl = new URL(file);
      } catch (error) {
        message.hidden = false;
        message.textContent = "The PDF link is invalid.";
        return;
      }

      const allowedHosts = new Set([
        "raw.githubusercontent.com"
      ]);

      if (!allowedHosts.has(fileUrl.hostname)) {
        message.hidden = false;
        message.textContent = "This PDF source is not allowed.";
        return;
      }

      // Compatibility for bookmarked viewer URLs; new pages link to PDFs directly.
      const prefix = "/wwang-ncsu/NeTWIS/main/papers/";
      const pathname = decodeURIComponent(fileUrl.pathname);
      const originalName = pathname.slice(prefix.length);
      if (!pathname.startsWith(prefix) || !/^[^/\\]+\.pdf$/i.test(originalName)) {
        message.hidden = false;
        message.textContent = "The PDF link is invalid.";
        return;
      }
      const renamedPdfs = {
        "25ML-Synergizing_Acoustic_and_Wi-Fi_Signals_for_Device-Free_Gesture_Recognition.pdf": "25lw-synergizing.pdf",
        "26ML-DuTrack.pdf": "26lw-dutrack.pdf",
        "26ML-UNI-FI.pdf": "26lw-uni-fi.pdf",
        "26-SWAMP-MOBICOM-submitted.pdf": "26lfw-swamp.pdf",
        "10185834.pdf": "20hme-prevention.pdf"
};
      const filename = Object.prototype.hasOwnProperty.call(renamedPdfs, originalName)
        ? renamedPdfs[originalName] : originalName;
      const pdfUrl = new URL("papers/" + encodeURIComponent(filename), window.location.href);
      message.hidden = false;
      const link = document.createElement("a");
      link.href = pdfUrl.href;
      link.textContent = "Open PDF";
      message.appendChild(link);
      window.location.replace(pdfUrl.href);
    })();
  </script>
</body>
</html>
